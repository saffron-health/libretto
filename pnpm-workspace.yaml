packages:
  - "apps/*"
  - "benchmarks"
  - "docs"
  - "evals"
  - "packages/*"

catalog:
  playwright: ^1.62.0

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@holocron.so/*"
  - "@mintlify/*"
  - affordance
  - framer-motion
  - libretto
  - lodash
  - mint
  - motion
  - playwright
  - playwright-core
  - safe-mdx
  - spiceflow
  - "@spiceflow/*"

enablePrePostScripts: false

blockExoticSubdeps: true

allowBuilds:
  '@google/genai': false
  agent-browser: true
  dev-browser: true
  esbuild: true
  fallow: false
  glimpseui: false
  keytar: true
  koffi: true
  protobufjs: true
  puppeteer: true
  sharp: true
  workerd: true
